name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/WengPixel-v1.0.0.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: WengPixel Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ### 🚀 WengPixel Android Release
            
            Aplikasi Android WengPixel untuk menghapus latar belakang foto dan meningkatkan resolusi gambar dengan AI.
            
            #### 📱 Unduh & Instal:
            - Unduh berkas **`WengPixel-v1.0.0.apk`** di bawah ini ke ponsel Android Anda.
            - Buka dan pasang (izinkan instalasi dari sumber tidak dikenal / peramban jika diminta).
            
            #### ✨ Fitur:
            - **Photo Picker:** Pilih gambar langsung tanpa izin penyimpanan sensitif.
            - **Hapus Latar:** Menghasilkan PNG transparan dengan model u2net AI.
            - **Upscale:** Opsi perbesaran 2x dan 4x dengan pelaporan resolusi jujur.
            - **Slider Sebelum & Sesudah:** Bandingkan hasil secara interaktif.
            - **Warna Latar:** Katalog warna untuk latar belakang transparan.
            - **Potong & Ukuran:** Rasio 1:1, 4:3, 16:9, 9:16 dan resize manual.
            - **Simpan & Bagikan:** Ekspor ke Galeri (MediaStore) dan bagikan ke media sosial.
            - **Riwayat Lokal:** Room Database lokal dengan manajemen hapus item & berkas.
          files: dist/WengPixel-v1.0.0.apk
          draft: false
          prerelease: false
